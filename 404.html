<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Drone Signal Lost | DRWEB AERO</title>
  <meta name="description" content="Telemetry lost. The drone drifted off-course outside cellular BVLOS coverage.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚁</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>
  <div class="aurora-bg"></div>

  <nav class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <svg class="navbar__logo-icon" viewBox="0 0 40 40" fill="none">
          <polygon points="20,4 36,14 36,28 20,38 4,28 4,14" stroke="#00e5ff" stroke-width="2" fill="rgba(0,229,255,0.1)"/>
          <circle cx="20" cy="20" r="6" fill="#00e5ff"/>
          <line x1="20" y1="4" x2="20" y2="14" stroke="#ff6b35" stroke-width="2"/>
        </svg>
        DRWEB <span>AERO</span>
      </a>
      <div class="navbar__links">
        <a href="index.html" class="navbar__link">Home</a>
        <a href="about.html" class="navbar__link">About</a>
        <a href="services.html" class="navbar__link">Services</a>
        <a href="pricing.html" class="navbar__link">Pricing</a>
        <a href="contact.html" class="navbar__link">Contact</a>
      </div>
    </div>
  </nav>

  <main class="error-page">
    <div class="error-page__drone">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Broken Sparking Drone -->
        <line x1="100" y1="100" x2="40" y2="50" stroke="#ff1744" stroke-width="8" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="160" y2="50" stroke="#1f2d4d" stroke-width="8" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="30" y2="100" stroke="#1f2d4d" stroke-width="8" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="170" y2="100" stroke="#ff1744" stroke-width="8" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="50" y2="150" stroke="#1f2d4d" stroke-width="8" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="150" y2="150" stroke="#1f2d4d" stroke-width="8" stroke-linecap="round"/>

        <!-- Sparking motor -->
        <circle cx="40" cy="50" r="12" fill="#141c33" stroke="#ff1744" stroke-width="2"/>
        <path d="M35 40 L45 42 L38 52 L48 54" stroke="#ffc107" stroke-width="2"/>

        <circle cx="160" cy="50" r="12" fill="#141c33" stroke="#00e5ff" stroke-width="2"/>
        <circle cx="30" cy="100" r="12" fill="#141c33" stroke="#00e5ff" stroke-width="2"/>
        <circle cx="170" cy="100" r="12" fill="#141c33" stroke="#ff1744" stroke-width="2"/>
        <circle cx="50" cy="150" r="12" fill="#141c33" stroke="#00e5ff" stroke-width="2"/>
        <circle cx="150" cy="150" r="12" fill="#141c33" stroke="#00e5ff" stroke-width="2"/>

        <!-- Tilting fuselage with smoke -->
        <polygon points="100,70 125,85 125,115 100,130 75,115 75,85" fill="#0d172a" stroke="#ff1744" stroke-width="2"/>
        <circle cx="100" cy="100" r="14" fill="#ff1744" opacity="0.8"/>
        <text x="100" y="104" font-family="'JetBrains Mono', monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">ERR</text>
      </svg>
    </div>

    <div class="error-page__code">404</div>
    <h1 class="error-page__title">Cellular Telemetry Lost</h1>
    <p class="error-page__text">
      The UAV drifted beyond geo-fenced coordinates into an uncharted sector. Autonomous fail-safe Return-to-Launch (RTL) has been initiated.
    </p>
    <a href="index.html" class="btn btn--primary magnetic">
      <span>Auto Return-to-Launch (RTL)</span>
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
  </main>

  <footer class="footer">
    <div class="container text-center" style="color: var(--clr-text-muted); font-size: 0.8rem;">
      &copy; 2026 DRWEB Aero. Incubatex Foundation, GIET University.
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>
</body>
</html>
