<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" fill="none" stroke="#121316">
  <defs>
    <style>
      .grid-line { stroke: #D6D3CB; stroke-width: 0.6; stroke-dasharray: 2 6; }
      .topo { stroke: #E0DDD5; stroke-width: 1; fill: none; }
      .path-glow { stroke: #FF4B26; stroke-width: 8; stroke-opacity: 0.15; fill: none; }
      .path-lead { stroke: #FF4B26; stroke-width: 2.5; fill: none; }
      .path-animated {
        stroke: #FF4B26;
        stroke-width: 2.5;
        stroke-dasharray: 8 8;
        animation: dashMove 2.5s linear infinite;
      }
      .waypoint { fill: #121316; stroke: #FF4B26; stroke-width: 2; }
      .telemetry { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #62656E; }
      .telemetry-bold { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #121316; font-weight: 600; }
      .telemetry-accent { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #FF4B26; font-weight: 600; }
      
      @keyframes dashMove {
        to { stroke-dashoffset: -32; }
      }
      @keyframes beaconPulse {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 10px; opacity: 0.3; }
      }
      .pulse-beacon { animation: beaconPulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Coordinate Background Grid -->
  <line x1="60" y1="80" x2="860" y2="80" class="grid-line" />
  <line x1="60" y1="160" x2="860" y2="160" class="grid-line" />
  <line x1="60" y1="240" x2="860" y2="240" class="grid-line" />
  <line x1="60" y1="320" x2="860" y2="320" class="grid-line" />
  <line x1="200" y1="50" x2="200" y2="390" class="grid-line" />
  <line x1="450" y1="50" x2="450" y2="390" class="grid-line" />
  <line x1="700" y1="50" x2="700" y2="390" class="grid-line" />

  <!-- Topographic Terrain Curves (Subtle Landscape Underlay) -->
  <path d="M 60 380 Q 200 360, 350 330 T 600 310 T 860 280 L 860 420 L 60 420 Z" fill="#EFECE6" fill-opacity="0.5" />
  <path d="M 60 380 Q 200 360, 350 330 T 600 310 T 860 280" class="topo" />
  <path d="M 60 400 Q 260 380, 480 370 T 860 330" class="topo" />

  <!-- Animated Flight Path Spline -->
  <path d="M 100 360 C 150 220, 220 140, 320 140 C 440 140, 480 230, 580 180 C 680 130, 760 170, 810 240" class="path-glow" />
  <path d="M 100 360 C 150 220, 220 140, 320 140 C 440 140, 480 230, 580 180 C 680 130, 760 170, 810 240" class="path-animated" />

  <!-- Return-to-Perch Projected Descent -->
  <path d="M 810 240 C 830 280, 835 330, 830 370" stroke="#8C8E94" stroke-width="1.4" stroke-dasharray="4 4" />

  <!-- Waypoints -->
  <!-- WP 01: Launch / Ground Datum -->
  <circle cx="100" cy="360" r="5" class="waypoint" />
  <text x="80" y="390" class="telemetry-bold">WP-01 [TAKEOFF]</text>
  <text x="80" y="405" class="telemetry">ALT: 0m • SPD: 0 m/s</text>

  <!-- WP 02: Cinematic Orbit Apex -->
  <circle cx="320" cy="140" r="5" class="waypoint" />
  <circle cx="320" cy="140" r="8" stroke="#FF4B26" stroke-width="1" class="pulse-beacon" fill="none" />
  <line x1="320" y1="140" x2="320" y2="85" stroke="#FF4B26" stroke-width="1" />
  <text x="330" y="85" class="telemetry-accent">APEX ELEVATION</text>
  <text x="330" y="100" class="telemetry-bold">ALT: 120.4 m • WIND: 14.2 m/s</text>
  <text x="330" y="115" class="telemetry">Hex Jitter Variance: ±0.003°</text>

  <!-- WP 03: Autonomous Subject Tracking -->
  <circle cx="580" cy="180" r="5" class="waypoint" />
  <line x1="580" y1="180" x2="580" y2="230" stroke="#FF4B26" stroke-width="1" />
  <text x="590" y="225" class="telemetry-accent">DYNAMIC TRACKING ENGAGED</text>
  <text x="590" y="240" class="telemetry-bold">SPEED: 72 km/h • 6-ROTOR ESC</text>
  <text x="590" y="255" class="telemetry">Neural Target Re-acquisition: 0.03s</text>

  <!-- WP 04: RTK Precision Perch Descent -->
  <circle cx="810" cy="240" r="5" class="waypoint" />
  <circle cx="830" cy="370" r="7" stroke="#FF4B26" stroke-width="2" fill="none" />
  <circle cx="830" cy="370" r="3" fill="#FF4B26" />
  <text x="735" y="390" class="telemetry-bold">WP-04 [PERCH BASE]</text>
  <text x="735" y="405" class="telemetry">RTK DOCKING ACCURACY: 0.8 cm</text>
</svg>
