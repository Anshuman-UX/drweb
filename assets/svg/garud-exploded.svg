<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" fill="none" stroke="#121316">
  <defs>
    <style>
      .datum { stroke: #FF4B26; stroke-width: 1; stroke-dasharray: 6 3; }
      .layer-outline { stroke: #121316; stroke-width: 1.8; fill: #EFECE6; fill-opacity: 0.6; }
      .detail { stroke: #62656E; stroke-width: 1.2; }
      .lbl-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; fill: #121316; letter-spacing: 0.05em; }
      .lbl-desc { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #62656E; }
      .lbl-accent { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #FF4B26; font-weight: 600; }
    </style>
  </defs>

  <!-- Central Vertical Deconstruction Axis -->
  <line x1="400" y1="40" x2="400" y2="600" class="datum" />

  <!-- ==================== TIER 1: Upper Aerodynamic Canopy (y: 60 - 130) ==================== -->
  <g id="layer-canopy" transform="translate(0, -20)">
    <path d="M 340 100 C 370 70, 430 70, 460 100 C 475 115, 460 135, 400 135 C 340 135, 325 115, 340 100 Z" class="layer-outline" />
    <path d="M 370 95 L 430 95" class="detail" />
    <circle cx="400" cy="115" r="4" fill="#FF4B26" />
    <!-- Annotation -->
    <line x1="460" y1="100" x2="560" y2="100" stroke="#FF4B26" stroke-width="1" />
    <text x="570" y="98" class="lbl-title">01 / DORSAL CANOPY</text>
    <text x="570" y="114" class="lbl-desc">Autoclaved T1000 Carbon Fiber Shell</text>
    <text x="570" y="128" class="lbl-accent">Weight: 14.2 g • Thickness: 0.6 mm</text>
  </g>

  <!-- ==================== TIER 2: OmniSight LiDAR & Sensor Ring (y: 160 - 210) ==================== -->
  <g id="layer-sensors" transform="translate(0, 0)">
    <ellipse cx="400" cy="190" rx="90" ry="24" class="layer-outline" />
    <circle cx="400" cy="190" r="16" stroke="#121316" stroke-width="1.4" fill="#FF4B26" fill-opacity="0.2" />
    <circle cx="400" cy="190" r="6" fill="#FF4B26" />
    <!-- 6 sensor nodes around ring -->
    <circle cx="320" cy="190" r="3" fill="#121316" />
    <circle cx="480" cy="190" r="3" fill="#121316" />
    <circle cx="360" cy="175" r="3" fill="#121316" />
    <circle cx="440" cy="175" r="3" fill="#121316" />
    <circle cx="360" cy="205" r="3" fill="#121316" />
    <circle cx="440" cy="205" r="3" fill="#121316" />
    <!-- Annotation -->
    <line x1="320" y1="190" x2="220" y2="190" stroke="#FF4B26" stroke-width="1" />
    <text x="50" y="185" class="lbl-title">02 / OMNISIGHT™ LIDAR CORE</text>
    <text x="50" y="201" class="lbl-desc">Hex-directional solid-state laser array</text>
    <text x="50" y="215" class="lbl-accent">120,000 pts/sec • 45m spherical shield</text>
  </g>

  <!-- ==================== TIER 3: Logic, Neural Engine & RF Board (y: 250 - 300) ==================== -->
  <g id="layer-avionics" transform="translate(0, 20)">
    <polygon points="330,265 470,265 490,295 310,295" class="layer-outline" />
    <rect x="380" y="272" width="40" height="18" rx="2" fill="#121316" />
    <text x="388" y="285" font-family="'JetBrains Mono'" font-size="8" fill="#F9F8F6">AI-40T</text>
    <!-- Annotation -->
    <line x1="490" y1="285" x2="560" y2="285" stroke="#FF4B26" stroke-width="1" />
    <text x="570" y="280" class="lbl-title">03 / EAGLEEYE COMPUTING CORE</text>
    <text x="570" y="296" class="lbl-desc">40 TOPS Neural Processor + Dual IMU</text>
    <text x="570" y="310" class="lbl-accent">Triple-redundant barometer & magnetometer</text>
  </g>

  <!-- ==================== TIER 4: Lithium-Sulfur Solid-State Cell (y: 330 - 380) ==================== -->
  <g id="layer-battery" transform="translate(0, 40)">
    <rect x="330" y="340" width="140" height="42" rx="6" class="layer-outline" />
    <line x1="330" y1="361" x2="470" y2="361" class="detail" />
    <circle cx="345" cy="350" r="3" fill="#FF4B26" />
    <text x="375" y="354" font-family="'JetBrains Mono'" font-size="9" fill="#121316">Li-S 4200mAh</text>
    <!-- Annotation -->
    <line x1="330" y1="360" x2="220" y2="360" stroke="#FF4B26" stroke-width="1" />
    <text x="50" y="355" class="lbl-title">04 / SOLID-STATE POWER CELL</text>
    <text x="50" y="371" class="lbl-desc">Lithium-Sulfur pouch architecture</text>
    <text x="50" y="385" class="lbl-accent">52 min endurance • Non-flammable solid electrolyte</text>
  </g>

  <!-- ==================== TIER 5: Carbon-Titanium Monocoque Chassis & Toroidal Arms (y: 420 - 480) ==================== -->
  <g id="layer-chassis" transform="translate(0, 60)">
    <!-- Main Frame Hub -->
    <ellipse cx="400" cy="430" rx="60" ry="20" class="layer-outline" />
    <!-- Arms -->
    <path d="M 350 425 L 220 380" stroke="#121316" stroke-width="2.5" />
    <path d="M 450 425 L 580 380" stroke="#121316" stroke-width="2.5" />
    <path d="M 360 435 L 240 480" stroke="#121316" stroke-width="2.5" />
    <path d="M 440 435 L 560 480" stroke="#121316" stroke-width="2.5" />

    <!-- Toroidal Propellers -->
    <ellipse cx="220" cy="380" rx="34" ry="12" class="layer-outline" transform="rotate(-15 220 380)" />
    <ellipse cx="580" cy="380" rx="34" ry="12" class="layer-outline" transform="rotate(15 580 380)" />
    <ellipse cx="240" cy="480" rx="34" ry="12" class="layer-outline" transform="rotate(15 240 480)" />
    <ellipse cx="560" cy="480" rx="34" ry="12" class="layer-outline" transform="rotate(-15 560 480)" />

    <!-- Annotation -->
    <line x1="580" y1="410" x2="630" y2="410" stroke="#FF4B26" stroke-width="1" />
    <text x="635" y="405" class="lbl-title">05 / MONOCOQUE SKELETON</text>
    <text x="635" y="421" class="lbl-desc">Grade 5 Titanium & Toray T1000</text>
    <text x="635" y="435" class="lbl-accent">48.5 dBA Toroidal WhisperDrive™</text>
  </g>

  <!-- ==================== TIER 6: 3-Axis Precision Gimbal & Optics (y: 530 - 600) ==================== -->
  <g id="layer-gimbal" transform="translate(0, 80)">
    <!-- Gimbal Fork -->
    <path d="M 380 515 C 380 540, 420 540, 420 515" stroke="#121316" stroke-width="2" fill="none" />
    <!-- Camera Housing -->
    <rect x="382" y="525" width="36" height="30" rx="4" class="layer-outline" />
    <!-- Lens Elements -->
    <circle cx="400" cy="540" r="10" stroke="#121316" stroke-width="1.8" fill="#121316" />
    <circle cx="400" cy="540" r="6" stroke="#FF4B26" stroke-width="1" fill="#FF4B26" fill-opacity="0.3" />
    <circle cx="400" cy="540" r="2" fill="#F9F8F6" />

    <!-- Annotation -->
    <line x1="382" y1="540" x2="220" y2="540" stroke="#FF4B26" stroke-width="1" />
    <text x="50" y="535" class="lbl-title">06 / FULL-FRAME 3-AXIS GIMBAL</text>
    <text x="50" y="551" class="lbl-desc">Mechanical Brushless Motors • ±0.005° jitter</text>
    <text x="50" y="565" class="lbl-accent">8K 30fps / 4K 120fps • 14 stops dynamic range</text>
  </g>
</svg>
