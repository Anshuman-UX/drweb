<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none" stroke="#121316">
  <defs>
    <style>
      .hairline { stroke-width: 0.8; stroke: #8C8E94; stroke-dasharray: 4 4; }
      .outline { stroke-width: 1.5; stroke: #121316; }
      .heavy { stroke-width: 2.2; stroke: #121316; }
      .accent-line { stroke: #FF4B26; stroke-width: 1.2; }
      .accent-fill { fill: #FF4B26; }
      .sensor-pulse { stroke: #FF4B26; stroke-width: 1; opacity: 0.4; }
    </style>
  </defs>

  <!-- Coordinate Grid Lines -->
  <line x1="40" y1="200" x2="560" y2="200" class="hairline" />
  <line x1="300" y1="40" x2="300" y2="360" class="hairline" />
  <circle cx="300" cy="200" r="140" class="hairline" />

  <!-- Monocoque Fuselage Outline -->
  <path d="M 300 90 C 330 90, 360 140, 350 220 C 345 260, 325 300, 300 310 C 275 300, 255 260, 250 220 C 240 140, 270 90, 300 90 Z" class="heavy" />

  <!-- Aerodynamic Toroidal Rotor Arms (Swept Carbon Wings) -->
  <!-- Forward Left Arm -->
  <path d="M 270 140 L 140 80" class="outline" />
  <!-- Forward Right Arm -->
  <path d="M 330 140 L 460 80" class="outline" />
  <!-- Aft Left Arm -->
  <path d="M 260 250 L 120 300" class="outline" />
  <!-- Aft Right Arm -->
  <path d="M 340 250 L 480 300" class="outline" />

  <!-- Toroidal Propeller Loops (Closed Aero Rings) -->
  <g class="toroidal-rotors">
    <!-- FL Rotor -->
    <ellipse cx="140" cy="80" rx="48" ry="18" class="outline" transform="rotate(-15 140 80)" />
    <circle cx="140" cy="80" r="6" fill="#121316" />
    <circle cx="140" cy="80" r="2" fill="#FF4B26" />
    
    <!-- FR Rotor -->
    <ellipse cx="460" cy="80" rx="48" ry="18" class="outline" transform="rotate(15 460 80)" />
    <circle cx="460" cy="80" r="6" fill="#121316" />
    <circle cx="460" cy="80" r="2" fill="#FF4B26" />

    <!-- RL Rotor -->
    <ellipse cx="120" cy="300" rx="48" ry="18" class="outline" transform="rotate(20 120 300)" />
    <circle cx="120" cy="300" r="6" fill="#121316" />
    <circle cx="120" cy="300" r="2" fill="#FF4B26" />

    <!-- RR Rotor -->
    <ellipse cx="480" cy="300" rx="48" ry="18" class="outline" transform="rotate(-20 480 300)" />
    <circle cx="480" cy="300" r="6" fill="#121316" />
    <circle cx="480" cy="300" r="2" fill="#FF4B26" />
  </g>

  <!-- Central Micro-Avionics Core -->
  <rect x="280" y="170" width="40" height="60" rx="4" class="outline" fill="#EFECE6" />
  <circle cx="300" cy="200" r="10" class="accent-line" />
  <circle cx="300" cy="200" r="3" class="accent-fill" />

  <!-- 3-Axis Gimbal Front Dome -->
  <path d="M 285 92 C 285 75, 315 75, 315 92 Z" class="heavy" fill="#121316" />
  <circle cx="300" cy="84" r="5" fill="#FF4B26" class="anatomy-lens-ring" />
  <circle cx="300" cy="84" r="14" class="sensor-pulse anatomy-sensor-beam" style="opacity: 0" />

  <!-- Hex-Directional LiDAR Sensor Apertures -->
  <circle cx="300" cy="115" r="3" class="accent-fill" />
  <circle cx="265" cy="180" r="2.5" class="accent-fill" />
  <circle cx="335" cy="180" r="2.5" class="accent-fill" />
  <circle cx="300" cy="290" r="3" class="accent-fill" />

  <!-- Technical Dimension & Angle Annotations -->
  <text x="300" y="380" font-family="'JetBrains Mono', monospace" font-size="10" fill="#62656E" text-anchor="middle" letter-spacing="2">GARUD MONOCOQUE BLUEPRINT // SCALE 1:1</text>
  <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8C8E94">DATUM: REF-01</text>
  <text x="530" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8C8E94" text-anchor="end">SPAN: 340mm</text>
</svg>
