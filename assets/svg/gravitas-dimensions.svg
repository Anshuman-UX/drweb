<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none" stroke="#121316">
  <defs>
    <style>
      .dim-line { stroke: #FF4B26; stroke-width: 1.2; }
      .dim-tick { stroke: #FF4B26; stroke-width: 1.5; }
      .dim-aux { stroke: #8C8E94; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .dim-body { stroke: #121316; stroke-width: 1.6; fill: #EFECE6; fill-opacity: 0.4; }
      .dim-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #121316; font-weight: 500; }
      .dim-text-accent { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #FF4B26; font-weight: 600; }
    </style>
  </defs>

  <!-- Title & Datum -->
  <text x="40" y="45" class="dim-text-accent">TOP-DOWN & ELEVATION DATUM MATRIX [ISO-2768-m]</text>
  <text x="40" y="65" class="dim-text" fill="#8C8E94">ALL DIMENSIONS IN MILLIMETERS (mm) / NET DRY MASS: 249 g</text>

  <!-- ==================== TOP-DOWN VIEW (Left: Center (280, 260)) ==================== -->
  <g id="top-view">
    <!-- Fuselage Body -->
    <path d="M 280 160 C 310 160, 335 195, 330 260 C 325 300, 305 340, 280 348 C 255 340, 235 300, 230 260 C 225 195, 250 160, 280 160 Z" class="dim-body" />
    <circle cx="280" cy="180" r="14" stroke="#121316" stroke-width="1.2" fill="#EFECE6" />
    <circle cx="280" cy="180" r="6" fill="#121316" />

    <!-- Rotor Arms -->
    <line x1="250" y1="200" x2="140" y2="150" stroke="#121316" stroke-width="2" />
    <line x1="310" y1="200" x2="420" y2="150" stroke="#121316" stroke-width="2" />
    <line x1="245" y1="290" x2="130" y2="330" stroke="#121316" stroke-width="2" />
    <line x1="315" y1="290" x2="430" y2="330" stroke="#121316" stroke-width="2" />

    <!-- Toroidal Propellers Rings -->
    <ellipse cx="140" cy="150" rx="38" ry="14" stroke="#121316" stroke-width="1.4" transform="rotate(-15 140 150)" />
    <circle cx="140" cy="150" r="4" fill="#FF4B26" />

    <ellipse cx="420" cy="150" rx="38" ry="14" stroke="#121316" stroke-width="1.4" transform="rotate(15 420 150)" />
    <circle cx="420" cy="150" r="4" fill="#FF4B26" />

    <ellipse cx="130" cy="330" rx="38" ry="14" stroke="#121316" stroke-width="1.4" transform="rotate(15 130 330)" />
    <circle cx="130" cy="330" r="4" fill="#FF4B26" />

    <ellipse cx="430" cy="330" rx="38" ry="14" stroke="#121316" stroke-width="1.4" transform="rotate(-15 430 330)" />
    <circle cx="430" cy="330" r="4" fill="#FF4B26" />

    <!-- Center Coordinate Axes -->
    <line x1="280" y1="120" x2="280" y2="380" class="dim-aux" />
    <line x1="90" y1="260" x2="470" y2="260" class="dim-aux" />

    <!-- Dimension: Width (Left Tip to Right Tip) -->
    <line x1="102" y1="150" x2="102" y2="100" class="dim-aux" />
    <line x1="458" y1="150" x2="458" y2="100" class="dim-aux" />
    <line x1="102" y1="105" x2="458" y2="105" class="dim-line" />
    <line x1="102" y1="99" x2="102" y2="111" class="dim-tick" />
    <line x1="458" y1="99" x2="458" y2="111" class="dim-tick" />
    <text x="250" y="98" class="dim-text-accent">288 mm (MAX SPAN)</text>

    <!-- Dimension: Length (Nose to Tail) -->
    <line x1="280" y1="160" x2="60" y2="160" class="dim-aux" />
    <line x1="280" y1="348" x2="60" y2="348" class="dim-aux" />
    <line x1="68" y1="160" x2="68" y2="348" class="dim-line" />
    <line x1="62" y1="160" x2="74" y2="160" class="dim-tick" />
    <line x1="62" y1="348" x2="74" y2="348" class="dim-tick" />
    <text x="18" y="260" class="dim-text-accent" transform="rotate(-90 40 260)">245 mm LENGTH</text>
  </g>

  <!-- ==================== SIDE PROFILE ELEVATION (Right: Center (640, 260)) ==================== -->
  <g id="side-view">
    <text x="540" y="150" class="dim-text" fill="#8C8E94">SIDE ELEVATION PROFILE</text>

    <!-- Side Silhouette -->
    <path d="M 540 270 Q 560 250, 600 242 Q 650 238, 710 262 Q 740 270, 720 278 Q 660 286, 580 282 Z" class="dim-body" />
    <!-- Gimbal Lens Downward -->
    <rect x="545" y="268" width="18" height="24" rx="3" stroke="#121316" stroke-width="1.4" fill="#121316" />
    <circle cx="554" cy="292" r="5" fill="#FF4B26" />

    <!-- Landing Skids -->
    <line x1="570" y1="282" x2="560" y2="315" stroke="#121316" stroke-width="2" />
    <line x1="670" y1="280" x2="680" y2="315" stroke="#121316" stroke-width="2" />
    <line x1="545" y1="315" x2="695" y2="315" stroke="#121316" stroke-width="2.5" />

    <!-- Rotor Hub & Blade Line -->
    <line x1="565" y1="245" x2="565" y2="232" stroke="#121316" stroke-width="1.8" />
    <ellipse cx="565" cy="232" rx="32" ry="4" stroke="#121316" stroke-width="1.2" fill="#EFECE6" />
    <line x1="695" y1="255" x2="695" y2="242" stroke="#121316" stroke-width="1.8" />
    <ellipse cx="695" cy="242" rx="32" ry="4" stroke="#121316" stroke-width="1.2" fill="#EFECE6" />

    <!-- Dimension: Height (Skid to Propeller Plane) -->
    <line x1="565" y1="228" x2="760" y2="228" class="dim-aux" />
    <line x1="545" y1="315" x2="760" y2="315" class="dim-aux" />
    <line x1="750" y1="228" x2="750" y2="315" class="dim-line" />
    <line x1="744" y1="228" x2="756" y2="228" class="dim-tick" />
    <line x1="744" y1="315" x2="756" y2="315" class="dim-tick" />
    <text x="765" y="275" class="dim-text-accent">88 mm</text>
  </g>

  <!-- Technical Monograph Footer Tag -->
  <line x1="40" y1="440" x2="760" y2="440" stroke="#D6D3CB" stroke-width="0.8" />
  <text x="40" y="465" class="dim-text">ARCHIVAL RECORD: GRAVITAS-AIRFRAME-SPECS // REV 4.2</text>
  <text x="560" y="465" class="dim-text-accent">PASSIVE RADAR CROSS-SECTION: 0.012 m²</text>
</svg>
